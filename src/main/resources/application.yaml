server:
  port: ${SERVER_PORT:8085}
  servlet:
    context-path: ${SERVER_SERVLET_CONTEXT_PATH:/notifications}

spring:
  application:
    name: notification-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/appdb}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        default_schema: notification
        jdbc:
          time_zone: UTC
  liquibase:
    enabled: ${SPRING_LIQUIBASE_ENABLED:true}
    change-log: classpath:db/changelog/db.changelog-master.yaml
    default-schema: ${SPRING_LIQUIBASE_DEFAULT_SCHEMA:notification}
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:guest}
    password: ${SPRING_RABBITMQ_PASSWORD:guest}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
    env:
      show-values: never
    configprops:
      show-values: never
  health:
    livenessState:
      enabled: true
    readinessState:
      enabled: true

notification:
  broker:
    exchange: ${NOTIFICATION_BROKER_EXCHANGE:notifications.events}
    dispatch-queue: ${NOTIFICATION_BROKER_DISPATCH_QUEUE:notifications.dispatch}
    dispatch-routing-key: ${NOTIFICATION_BROKER_DISPATCH_ROUTING_KEY:notifications.dispatch}
  contact:
    recipients: ${NOTIFICATION_CONTACT_RECIPIENTS:support@electrahub.net}
    ip-hash-salt: ${NOTIFICATION_CONTACT_IP_HASH_SALT:change-me}
    duplicate-window-minutes: ${NOTIFICATION_CONTACT_DUPLICATE_WINDOW_MINUTES:15}
  channel:
    email:
      real-send-enabled: ${NOTIFICATION_CHANNEL_EMAIL_REAL_SEND_ENABLED:false}
      daily-limit: ${NOTIFICATION_CHANNEL_EMAIL_DAILY_LIMIT:59}
      rate-per-second: ${NOTIFICATION_CHANNEL_EMAIL_RATE_PER_SECOND:1}
      retry-enabled: ${NOTIFICATION_CHANNEL_EMAIL_RETRY_ENABLED:false}
    sms:
      real-send-enabled: ${NOTIFICATION_CHANNEL_SMS_REAL_SEND_ENABLED:false}
    push:
      real-send-enabled: ${NOTIFICATION_CHANNEL_PUSH_REAL_SEND_ENABLED:false}
    inapp:
      enabled: ${NOTIFICATION_CHANNEL_INAPP_ENABLED:true}

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] [%X{traceId:-},%X{spanId:-}] %logger{36} - %msg%n"
