server:
  port: ${SERVER_PORT:8085}
  servlet:
    context-path: ${SERVER_SERVLET_CONTEXT_PATH:/notifications}

spring:
  application:
    name: notification-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/appdb}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        default_schema: notification
        jdbc:
          time_zone: UTC
  liquibase:
    enabled: ${SPRING_LIQUIBASE_ENABLED:true}
    change-log: classpath:db/changelog/db.changelog-master.yaml
    default-schema: ${SPRING_LIQUIBASE_DEFAULT_SCHEMA:public}
    liquibase-schema: ${SPRING_LIQUIBASE_SCHEMA:public}
  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:guest}
    password: ${SPRING_RABBITMQ_PASSWORD:guest}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
    env:
      show-values: never
    configprops:
      show-values: never
  health:
    livenessState:
      enabled: true
    readinessState:
      enabled: true

notification:
  user-service:
    base-url: ${NOTIFICATION_USER_SERVICE_BASE_URL:http://user-service:8082}
    internal-token: ${APP_SECURITY_INTERNAL_TOKEN:}
  sensitive-email:
    max-attempts: ${NOTIFICATION_SENSITIVE_EMAIL_MAX_ATTEMPTS:4}
  broker:
    exchange: ${NOTIFICATION_BROKER_EXCHANGE:notifications.events}
    dispatch-queue: ${NOTIFICATION_BROKER_DISPATCH_QUEUE:notifications.dispatch}
    dispatch-routing-key: ${NOTIFICATION_BROKER_DISPATCH_ROUTING_KEY:notifications.dispatch}
    dispatch-dead-letter-exchange: ${NOTIFICATION_BROKER_DISPATCH_DLQ_EXCHANGE:notifications.dead-letter}
    dispatch-dead-letter-queue: ${NOTIFICATION_BROKER_DISPATCH_DLQ:notifications.dispatch.dlq}
    dispatch-dead-letter-routing-key: ${NOTIFICATION_BROKER_DISPATCH_DLQ_ROUTING_KEY:notifications.dispatch.dead-letter}
    dispatch-retry-max-attempts: ${NOTIFICATION_BROKER_DISPATCH_RETRY_MAX_ATTEMPTS:4}
    dispatch-retry-initial-interval-ms: ${NOTIFICATION_BROKER_DISPATCH_RETRY_INITIAL_INTERVAL_MS:1000}
    dispatch-retry-multiplier: ${NOTIFICATION_BROKER_DISPATCH_RETRY_MULTIPLIER:2.0}
    dispatch-retry-max-interval-ms: ${NOTIFICATION_BROKER_DISPATCH_RETRY_MAX_INTERVAL_MS:10000}
    domain-event-queue: ${NOTIFICATION_BROKER_DOMAIN_EVENT_QUEUE:notifications.domain-events}
    domain-event-routing-key: ${NOTIFICATION_BROKER_DOMAIN_EVENT_ROUTING_KEY:notifications.domain}
    realtime-exchange: ${NOTIFICATION_BROKER_REALTIME_EXCHANGE:notifications.realtime}
  inbox:
    stream-timeout-ms: ${NOTIFICATION_INBOX_STREAM_TIMEOUT_MS:1800000}
    heartbeat-ms: ${NOTIFICATION_INBOX_HEARTBEAT_MS:15000}
  contact:
    recipients: ${NOTIFICATION_CONTACT_RECIPIENTS:support@electrahub.net}
    ip-hash-salt: ${NOTIFICATION_CONTACT_IP_HASH_SALT:change-me}
    duplicate-window-minutes: ${NOTIFICATION_CONTACT_DUPLICATE_WINDOW_MINUTES:15}
  channel:
    email:
      real-send-enabled: ${NOTIFICATION_CHANNEL_EMAIL_REAL_SEND_ENABLED:false}
      daily-limit: ${NOTIFICATION_CHANNEL_EMAIL_DAILY_LIMIT:59}
      rate-per-second: ${NOTIFICATION_CHANNEL_EMAIL_RATE_PER_SECOND:1}
      retry-enabled: ${NOTIFICATION_CHANNEL_EMAIL_RETRY_ENABLED:false}
      provider: ${NOTIFICATION_CHANNEL_EMAIL_PROVIDER:smtp-email}
      smtp:
        host: ${NOTIFICATION_EMAIL_SMTP_HOST:}
        port: ${NOTIFICATION_EMAIL_SMTP_PORT:587}
        username: ${NOTIFICATION_EMAIL_SMTP_USERNAME:}
        password: ${NOTIFICATION_EMAIL_SMTP_PASSWORD:}
        from-email: ${NOTIFICATION_EMAIL_SMTP_FROM_EMAIL:no-reply@notify.electrahub.net}
        from-name: ${NOTIFICATION_EMAIL_SMTP_FROM_NAME:ElectraHub}
        starttls-enabled: ${NOTIFICATION_EMAIL_SMTP_STARTTLS_ENABLED:true}
        auth-enabled: ${NOTIFICATION_EMAIL_SMTP_AUTH_ENABLED:true}
        connection-timeout-ms: ${NOTIFICATION_EMAIL_SMTP_CONNECTION_TIMEOUT_MS:10000}
        timeout-ms: ${NOTIFICATION_EMAIL_SMTP_TIMEOUT_MS:10000}
        write-timeout-ms: ${NOTIFICATION_EMAIL_SMTP_WRITE_TIMEOUT_MS:10000}
    sms:
      real-send-enabled: ${NOTIFICATION_CHANNEL_SMS_REAL_SEND_ENABLED:false}
      twilio:
        account-sid: ${TWILIO_ACCOUNT_SID:}
        auth-token: ${TWILIO_AUTH_TOKEN:}
        from-number: ${TWILIO_FROM_NUMBER:}
    push:
      real-send-enabled: ${NOTIFICATION_CHANNEL_PUSH_REAL_SEND_ENABLED:false}
      daily-limit: ${NOTIFICATION_CHANNEL_PUSH_DAILY_LIMIT:500}
      rate-per-second: ${NOTIFICATION_CHANNEL_PUSH_RATE_PER_SECOND:5}
      firebase:
        project-id: ${FIREBASE_PROJECT_ID:}
        service-account-path: ${FIREBASE_SERVICE_ACCOUNT_PATH:}
        service-account-json: ${FIREBASE_SERVICE_ACCOUNT_JSON:}
        service-account-base64: ${FIREBASE_SERVICE_ACCOUNT_BASE64:}
    inapp:
      enabled: ${NOTIFICATION_CHANNEL_INAPP_ENABLED:true}
  portal:
    driver-reset-password-url: ${NOTIFICATION_DRIVER_RESET_PASSWORD_URL:https://driver-portal.electrahub.net/reset-password}

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] [%X{traceId:-},%X{spanId:-}] %logger{36} - %msg%n"
