databaseChangeLog:
  - changeSet:
      id: 012-upgrade-compliant-receipt-templates
      author: codex
      changes:
        - insert:
            schemaName: notification
            tableName: notification_templates
            columns:
              - column: { name: id, valueComputed: "CAST('2a111111-1111-4111-8111-111111111111' AS UUID)" }
              - column: { name: project_key, value: electrahub }
              - column: { name: template_key, value: charging-receipt-ready }
              - column: { name: channel, value: EMAIL }
              - column: { name: locale, value: en-US }
              - column: { name: country_code, value: "*" }
              - column: { name: version, valueNumeric: 2 }
              - column:
                  name: subject_template
                  valueClobFile: ../templates/electrahub/charging-receipt-email.subject.txt
                  encoding: UTF-8
              - column:
                  name: body_template
                  valueClobFile: ../templates/electrahub/charging-receipt-email.html
                  encoding: UTF-8
              - column: { name: content_type, value: "text/html; charset=UTF-8" }
              - column: { name: enabled, valueBoolean: true }
              - column: { name: created_at, valueComputed: CURRENT_TIMESTAMP }
              - column: { name: updated_at, valueComputed: CURRENT_TIMESTAMP }
        - insert:
            schemaName: notification
            tableName: notification_templates
            columns:
              - column: { name: id, valueComputed: "CAST('2a222222-2222-4222-8222-222222222222' AS UUID)" }
              - column: { name: project_key, value: electrahub }
              - column: { name: template_key, value: charging-receipt-ready }
              - column: { name: channel, value: EMAIL }
              - column: { name: locale, value: en-US }
              - column: { name: country_code, value: IN }
              - column: { name: version, valueNumeric: 2 }
              - column:
                  name: subject_template
                  valueClobFile: ../templates/electrahub/in/charging-receipt-email.subject.txt
                  encoding: UTF-8
              - column:
                  name: body_template
                  valueClobFile: ../templates/electrahub/in/charging-receipt-email.html
                  encoding: UTF-8
              - column: { name: content_type, value: "text/html; charset=UTF-8" }
              - column: { name: enabled, valueBoolean: true }
              - column: { name: created_at, valueComputed: CURRENT_TIMESTAMP }
              - column: { name: updated_at, valueComputed: CURRENT_TIMESTAMP }
        - sql:
            sql: |
              insert into notification.notification_templates (
                id, project_key, template_key, channel, locale, country_code, version,
                subject_template, body_template, content_type, enabled, created_at, updated_at
              )
              select countries.id, base.project_key, base.template_key, base.channel, base.locale,
                     countries.country_code, base.version, base.subject_template, base.body_template,
                     base.content_type, true, current_timestamp, current_timestamp
              from notification.notification_templates base
              cross join (values
                (cast('2a333333-3333-4333-8333-333333333333' as uuid), 'US'),
                (cast('2a444444-4444-4444-8444-444444444444' as uuid), 'CA'),
                (cast('2a555555-5555-4555-8555-555555555555' as uuid), 'NL'),
                (cast('2a666666-6666-4666-8666-666666666666' as uuid), 'DE'),
                (cast('2a777777-7777-4777-8777-777777777777' as uuid), 'SE'),
                (cast('2a888888-8888-4888-8888-888888888888' as uuid), 'GB'),
                (cast('2a999999-9999-4999-8999-999999999999' as uuid), 'SG')
              ) as countries(id, country_code)
              where base.id = cast('2a111111-1111-4111-8111-111111111111' as uuid)
